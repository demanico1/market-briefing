# 아카이브 인덱스 자동 복구
#
# 왜 필요한가 (2026-09-13)
# ------------------------
# index.html 은 발행할 때마다 통째로 다시 만들어지는데, 그걸 만드는 publish.py 가
# 여러 대(이 PC, 서버 PC)에 사본으로 흩어져 있고 동기화 장치가 없다.
# 서버 사본이 scan 을 모르는 옛 버전이라, 9/13 미국장 브리핑이 나가면서
# 9/12 에 올린 스캔 목록이 인덱스에서 통째로 사라졌다.
# (파일은 남아 있었고 링크만 없어져 사이트에서 안 보였다)
#
# → push 될 때마다 GitHub 이 저장소 내용 그대로 목록을 다시 만든다.
#   어느 PC가 어떤 버전으로 올리든 최종 인덱스는 항상 옳다. 서버는 손댈 필요 없다.
#
# 무한 루프 방지
# --------------
# 처음엔 paths-ignore 로 막으려 했는데 **push 트리거 자체가 안 걸렸다**
# (경로 필터가 아닌 다른 이유. 실측으로 두 번 확인).
# 그래서 경로 필터를 쓰지 않고, **봇이 만든 커밋이면 job 을 건너뛴다.**
# 봇 커밋도 트리거는 되지만 즉시 끝나므로 루프가 돌지 않는다.

name: rebuild-index

# ⚠ push 트리거를 믿지 마라 — 안전망이 필요하다
#
#   이 PC에서 push 해도 **이 워크플로가 안 걸렸다** (실측 3회).
#   같은 push 로 GitHub 자체 `pages build and deployment` 는 정상 실행됐고,
#   `workflow_dispatch` 수동 실행도 정상이었다. 즉 Actions 자체는 멀쩡한데
#   **push 이벤트가 사용자 워크플로를 깨우지 못한다.** 원인은 특정하지 못했다
#   (커밋 author 가 GitHub 계정에 연결돼 있지 않다 — `author: null` — 는 점이
#    걸리지만 확증은 없다). 서버는 SSH deploy key 로 push 하므로 다를 수 있다.
#
#   → push 는 그대로 두되, **30분마다 도는 schedule 을 안전망으로 깐다.**
#     push 가 걸리면 즉시, 안 걸려도 30분 안에 인덱스가 복구된다.
#     공개 저장소라 Actions 사용료는 없고, 한 번 실행에 20초쯤 걸린다.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: rebuild-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    # 봇이 올린 커밋이면 아무것도 하지 않는다 (무한 루프 차단).
    # schedule 로 들어온 실행은 actor 가 봇이 아니므로 정상 진행된다.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 인덱스 목록 재생성
        run: python _site_tools/build_index.py .

      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet index.html; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "index: 저장소 내용으로 목록 재생성 (자동)"
          git push
